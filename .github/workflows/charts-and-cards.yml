name: Refresh Profile Assets
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/radar.py --data assets/skills.json -o assets/radar
      - run: python scripts/radar.py --github utkraa9 -o assets/radar-langs --limit 7
      - run: python scripts/cards.py --user utkraa9 --out assets
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          git diff --cached --quiet || git commit -m 'chore: refresh profile assets'
          git push
