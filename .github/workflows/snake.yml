name: Contribution Snake
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: utkraa9
          outputs: |
            dist/snake.svg?color_snake=39d353
            dist/snake-dark.svg?palette=github-dark&color_snake=39d353
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
